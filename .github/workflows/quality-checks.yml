name: Quality Checks

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: '22'

jobs:
  node-version-consistency:
    name: Node Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert engines.node and .nvmrc agree
        run: |
          set -euo pipefail
          EXPECTED=22

          engines=$(node -p "require('./package.json').engines.node")
          nvmrc=$(tr -d '[:space:]' < .nvmrc)

          engines_major=$(echo "$engines" | grep -oE '[0-9]+' | head -1)
          nvmrc_major=${nvmrc%%.*}

          echo "engines.node = $engines (major $engines_major)"
          echo ".nvmrc       = $nvmrc (major $nvmrc_major)"

          fail=0
          for pair in "engines.node:$engines_major" ".nvmrc:$nvmrc_major"; do
            name=${pair%%:*}
            major=${pair##*:}
            if [ "$major" != "$EXPECTED" ]; then
              echo "::error::$name pins Node $major, expected $EXPECTED"
              fail=1
            fi
          done

          if [ "$fail" != "0" ]; then
            echo "Node version pins have drifted. Align package.json engines and .nvmrc to Node $EXPECTED."
            exit 1
          fi
          echo "All Node version pins agree on major $EXPECTED."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: tsc
        run: pnpm typecheck

  test:
    name: Test
    needs: [lint, format, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Jest
        run: pnpm test -- --ci --passWithNoTests --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    needs: [lint, format, typecheck]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Next.js build
        run: pnpm build
